  <script src="assets/gsap.min.js"></script>
  <script>
    (function () {
      const DURATION = 5.9;
      const selector = name => '[id="f02-product-' + name + '"]';
      const tl = gsap.timeline({ paused: true });

      tl.fromTo(selector('brand'), { x: -72, opacity: 0 }, { x: 0, opacity: 1, duration: .34, ease: 'power3.out' }, 0);
      tl.fromTo(selector('reader'), { y: 36, scale: .98, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: .42, ease: 'power3.out' }, .08);
      tl.fromTo(selector('stamp'), { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: .3, ease: 'power3.out' }, .32);
      tl.fromTo(selector('caption'), { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: .3, ease: 'power3.out' }, .48);
      tl.fromTo(selector('home'), { y: 0 }, { y: -170, duration: 5.35, ease: 'none' }, .5);

      const STATES = [
        { t: 0, text: '', strike: false },
        { t: 1.8, text: '只看结果', strike: true },
        { t: 2.65, text: '看清过程', strike: false },
        { t: 3.6, text: '', strike: false }
      ];
      const sequenceEl = document.getElementById('f02-product-sequence');
      const strikeEl = document.getElementById('f02-product-strike');
      const driver = { t: 0 };
      let previousState = -1;
      function updateText() {
        let stateIndex = 0;
        for (let index = STATES.length - 1; index >= 0; index--) {
          if (driver.t >= STATES[index].t) { stateIndex = index; break; }
        }
        if (stateIndex !== previousState) {
          sequenceEl.textContent = STATES[stateIndex].text;
          strikeEl.style.opacity = STATES[stateIndex].strike ? '1' : '0';
          previousState = stateIndex;
        }
      }
      updateText();
      tl.to(driver, { t: DURATION, duration: DURATION, ease: 'none', onUpdate: updateText }, 0);
      tl.fromTo(selector('headline'), { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: .34, ease: 'power3.out' }, 3.6);

      const CONTENT = [
        { id: 'step-1', text: '选案例', arrow: null },
        { id: 'step-2', text: '拆链路', arrow: 'arrow-1' },
        { id: 'step-3', text: '试验证', arrow: 'arrow-2' }
      ];
      const BASE_DURATION = .6;
      const SEC_PER_CHAR = .04;
      let cumulative = 3.66;
      const TIMELINE = CONTENT.map(entry => {
        const duration = BASE_DURATION + entry.text.length * SEC_PER_CHAR;
        const start = cumulative;
        cumulative += duration;
        return { ...entry, start, end: cumulative };
      });
      TIMELINE.forEach(entry => {
        tl.fromTo(selector(entry.id), { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: .28, ease: 'power3.out' }, entry.start);
        if (entry.arrow) {
          tl.fromTo(selector(entry.arrow), { x: -10, opacity: 0 }, { x: 0, opacity: 1, duration: .22, ease: 'power3.out' }, entry.start);
        }
      });

      window.__timelines = window.__timelines || {};
      window.__timelines['02-product'] = tl;
    })();
  </script>
