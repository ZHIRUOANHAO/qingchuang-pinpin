<script src="assets/gsap.min.js"></script>
<style data-brand-tokens></style>
<style>
@font-face{font-family:'Promo CJK';src:url('assets/fonts/promo-cjk.ttf') format('truetype');font-weight:100 900}
#captions-root{position:absolute;inset:0;pointer-events:none}
.caption-stage{position:absolute;left:70px;right:70px;top:1620px;height:210px;display:flex;align-items:center;justify-content:center}
.caption-group{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0}
.caption-pill{max-width:100%;padding:24px 34px;background:#FFF9EF;border:3px solid #243E3B;border-radius:24px;box-shadow:6px 6px 0 #243E3B}
.caption-line{font:500 46px/1.35 'Promo CJK',sans-serif;text-align:center;color:#243E3B}
</style>
<div id="captions-root" data-composition-id="captions" data-timeline-locked data-start="0" data-duration="0" data-width="0" data-height="0">
  <div id="caption-stage" class="caption-stage"></div>
</div>
<script>
var GROUPS = [];
var DURATION = 0;
var stage=document.getElementById('caption-stage');
var tl=gsap.timeline({paused:true});
GROUPS.forEach(function(g){
  var el=document.createElement('div');el.id=g.id;el.className='caption-group';
  var pill=document.createElement('div');pill.className='caption-pill';
  var line=document.createElement('div');line.className='caption-line';line.textContent=g.text;
  pill.appendChild(line);el.appendChild(pill);stage.appendChild(el);
  tl.set(el,{opacity:1},g.start);tl.set(el,{opacity:0},g.end);
});
window.__timelines['captions']=tl;
</script>
